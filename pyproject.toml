[project]
name = "flame-storage-service"
version = "0.2.2"
description = "Service for handling intermediate files and submitting result files to the FLAME Hub."
authors = [
    {name = "Maximilian Jugl"},
    {name = "Paul Brassel", email="Paul.Brassel@medizin.uni-leipzig.de"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "minio (>=7.2.0,<8)",
    "fastapi[standard] (>=0.115.0,<1)",
    "pydantic-settings (>=2.7.0,<3)",
    "python-multipart (>=0.0.20,<1)",
    "jwcrypto (>=1.5.0,<2)",
    "tomli (>=2.2.0,<3)",
    "peewee (>=4.3.0,<5)",
    "psycopg2-binary (>=2.9.0,<3)",
    "cryptography (>=50.0.0,<51)",
    "flame-hub-client (>=0.2.0)",
    "truststore (>=0.10.1,<1)",
    "opendp (>=0.12.1,<0.13.0)",
    "peewee-migrate (>=1.15.0,<2.0.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "anyio (>=4.14.2,<5.0.0)",
]
license = "Apache-2.0"

[project.scripts]
flame-storage = "project.main:run_server"
openapi-spec = "project.main:openapi_spec"

[tool.poetry]
packages = [{ include = "project" }]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "live: mark an integration test that runs against live infra."
]
env_files = [
    ".env",
    ".env.test"
]
addopts = "--cov=project --cov-branch"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-env (>=1.7.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "readme-coverage-badger (>=1.1.0,<2.0.0)",
]
